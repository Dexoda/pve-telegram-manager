name: Deploy PVE Telegram Manager

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run syntax check
        run: |
          python -m py_compile src/*.py
          python -m py_compile src/**/*.py
      
      - name: Build Docker image
        run: |
          docker build -t pve-telegram-bot:latest .
      
      - name: Save Docker image
        run: |
          docker save pve-telegram-bot:latest | gzip > pve-telegram-bot.tar.gz
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: pve-telegram-bot.tar.gz
          retention-days: 7
      
      # Optional: Deploy to server via SSH
      # Uncomment and configure the following steps to deploy automatically
      
