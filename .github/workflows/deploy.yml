      #       cd /opt/pve-telegram-bot
      #       docker load < pve-telegram-bot.tar.gz
      #       docker-compose down
      #       docker-compose up -d
      
      - name: Deployment info
        run: |
          echo "✅ Build completed successfully!"
          echo "Docker image saved as artifact."
          echo "To deploy manually:"
          echo "1. Download the artifact"
          echo "2. Load image: docker load < pve-telegram-bot.tar.gz"
          echo "3. Run: docker-compose up -d"
